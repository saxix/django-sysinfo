[tox]
envlist = py{312,313}-d{42,52}
skipsdist=False
isolated_build=True

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[pytest]
python_paths=./tests/demo/
django_find_project = false
DJANGO_SETTINGS_MODULE=demoproject.settings
norecursedirs = .tox docs ./demo/
python_files=tests/test_*.py
doctest_optionflags=ELLIPSIS ALLOW_UNICODE ALLOW_UNICODE
addopts =
        --reuse-db
        --doctest-modules
        --tb=short
        --capture=no
        --doctest-modules
        --echo-version django
        --echo-attr django.conf.settings.DATABASES.default.ENGINE
        --cov-report=html
        --cov-config=tests/.coveragerc
        --cov django_sysinfo


pep8ignore = * ALL
markers =
    functional: mark a test as functional

[testenv]
passenv =
    TRAVIS
    TRAVIS_JOB_ID
    TRAVIS_BRANCH
    PYTHONDONTWRITEBYTECODE
    POSTGRES_HOST
    POSTGRES_PASSWORD
    POSTGRES_PORT
whitelist_externals = poetry
setenv =
    PYTHONDONTWRITEBYTECODE=1
    PY_IGNORE_IMPORT_MISMATCH=1

;usedevelop=true
changedir={toxinidir}

deps=
    poetry
    d22: django==2.2.*
    d32: Django==3.2.*
    d40: Django==4.0.*
    d41: Django==4.1.*
    d42: Django==4.2.*
    d50: Django==5.0.*
    d51: Django==5.1.*
    d52: Django==5.2.*

commands =
     poetry install --no-root
     poetry run pytest tests/ -q --create-db --pyargs django_sysinfo --cov=django_sysinfo --cov-config=tests/.coveragerc --doctest-modules
